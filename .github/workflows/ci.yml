name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metergraph
          POSTGRES_PASSWORD: metergraph
          POSTGRES_DB: metergraph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metergraph"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "core[dev]" -e "server[dev]"
      - run: pytest core/tests server/tests -q
        env:
          MG_TEST_DATABASE_URL: postgresql://metergraph:metergraph@localhost:5432/metergraph_test

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metergraph
          POSTGRES_PASSWORD: metergraph
          POSTGRES_DB: metergraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metergraph"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e "core[dev]" -e "server[dev]"
      - name: Check out latest MeterGraph SDK
        uses: actions/checkout@v4
        with:
          repository: PioneerSquareLabs/metergraphsdk
          ref: main
          path: .latest-metergraphsdk
      - name: Pack latest TypeScript SDK
        run: |
          npm install
          mkdir -p /tmp/metergraph-sdk-package
          npm pack --pack-destination /tmp/metergraph-sdk-package
        working-directory: .latest-metergraphsdk/typescript
      - name: Install packed SDK smoke fixture with AI SDK 6
        run: npm install --ignore-scripts --no-save ai@6.0.116 /tmp/metergraph-sdk-package/metergraph-*.tgz
        working-directory: server/tests/e2e/typescript-sdk
      - name: Start server
        run: |
          uvicorn metergraph_server.main:app --port 8787 &
          for i in $(seq 1 30); do curl -sf localhost:8787/healthz && break; sleep 1; done
        env:
          DATABASE_URL: postgresql://metergraph:metergraph@localhost:5432/metergraph
          MG_TOKENS: ci-token
      - name: Seed demo traffic through the published SDK
        run: python scripts/seed_demo.py 3
        env:
          MG_URL: http://localhost:8787
          MG_TOKEN: ci-token
      - name: Assert demo separates health from finish reason
        run: |
          curl -sS -H "Authorization: Bearer ci-token" \
            "http://localhost:8787/v1/calls?func=demo.agent%3Astatus_lifecycle" \
            -o /tmp/status-demo.json
          python3 - /tmp/status-demo.json <<'EOF'
          import json, sys
          with open(sys.argv[1]) as handle:
              rows = json.load(handle)["items"]
          observed = {
              (row["status_code"], row["finish_reason"], row["error_type"])
              for row in rows
          }
          assert observed == {
              ("unset", "tool-calls", None),
              ("unset", "stop", None),
              ("error", None, "DemoTimeout"),
          }, observed
          EOF
      - name: Capture through latest TypeScript SDK
        run: node smoke.mjs
        working-directory: server/tests/e2e/typescript-sdk
        env:
          MG_URL: http://localhost:8787
          MG_TOKEN: ci-token
      - name: Assert cost-by-function aggregates
        run: |
          code=$(curl -s -o /tmp/usage.json -w "%{http_code}" -H "Authorization: Bearer ci-token" "http://localhost:8787/v1/usage?group_by=func")
          echo "HTTP $code"
          head -c 400 /tmp/usage.json; echo
          test "$code" = "200"
          python3 - /tmp/usage.json <<'EOF'
          import json, sys
          with open(sys.argv[1]) as handle:
              items = {i["key"]: i for i in json.load(handle)["items"]}
          assert "support.classify_ticket" in items, items.keys()
          assert "extraction.parse_receipt" in items, items.keys()
          assert all(i["unpriced_calls"] == 0 for i in items.values()), items
          assert all(i["cost_usd"] > 0 for i in items.values()), items
          print("e2e OK:", {k: round(v["cost_usd"], 4) for k, v in items.items()})
          EOF
