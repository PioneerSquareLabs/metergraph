name: Public contribution check
on: pull_request
jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public references
        run: python3 scripts/check_publication.py origin/${{ github.event.repository.default_branch }}
