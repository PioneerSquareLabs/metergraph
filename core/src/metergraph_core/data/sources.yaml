# MeterGraph public pricing source registry.
#
# One entry per official pricing source: the provider and catalog channel it
# prices, its URL, the parser that reads it, the page's shape and clarity, the
# catalog price columns it represents, its expected structural fingerprint,
# whether automated low-risk refreshes may use it and within which bounds, and
# what evidence from it may be kept.
#
# Refresh tools fetch only URLs listed here. A source becomes low-risk only
# through a reviewed change to this file; nobody, including the provider,
# marks their own source low-risk. Seeding a source does not make it
# low-risk. See core/README.md for the review and contribution path.
#
# `fingerprint: null` means the page structure has not been recorded, so a
# low-risk refresh escalates instead of proposing changes.
schema_version: 1
sources:
  - id: openai-api-pricing
    provider: openai
    channel: openai-api
    catalog_channel: true
    url: https://developers.openai.com/api/docs/pricing
    parser: openai
    source_shape: token_embedded_data
    clarity: structured
    dimensions: [input_per_mtok, cache_read_per_mtok, cache_write_5m_per_mtok, output_per_mtok]
    fingerprint: sha256:7434c47c453d6f5ec373fee44911c235b5519170e3bc95817ab8e9f5d2f5aacf
    low_risk:
      eligible: true
      max_relative_change: "0.5"
      dimensions: [input_per_mtok, cache_read_per_mtok, cache_write_5m_per_mtok, output_per_mtok]
    evidence: &unreviewed_terms
      store_raw: false
      redistribute_raw: false
      excerpt_chars: 0
      reason: >-
        The provider's terms for storing or redistributing page content have
        not been reviewed. Keep only the structural fingerprint and the
        normalized values the extractor reads.

  - id: anthropic-api-pricing
    provider: anthropic
    channel: anthropic-api
    catalog_channel: true
    url: https://platform.claude.com/docs/en/about-claude/pricing
    parser: anthropic
    source_shape: token_table
    clarity: structured
    # The 5m column is the base cache-write rate the catalog stores in
    # cache_write_5m_per_mtok; the parser does not read the 1h column.
    dimensions: [input_per_mtok, output_per_mtok, cache_write_5m_per_mtok, cache_read_per_mtok]
    fingerprint: sha256:194f4d2c8095cc3041c75fb13ecdd1a3cdcccebfcf3aee1add5abd3eba2d415c
    low_risk:
      eligible: true
      max_relative_change: "0.5"
      dimensions: [input_per_mtok, output_per_mtok, cache_write_5m_per_mtok, cache_read_per_mtok]
    evidence: *unreviewed_terms

  - id: google-api-pricing
    provider: google
    channel: google-api
    catalog_channel: true
    url: https://ai.google.dev/gemini-api/docs/pricing
    parser: google
    source_shape: token_table
    clarity: semi_structured
    dimensions: [input_per_mtok, output_per_mtok, cache_read_per_mtok]
    fingerprint: sha256:ce07b6f065f5dfd21a9f14a005c30de1f5802e3ba118dc1dbe088a124c84adbd
    low_risk:
      eligible: true
      max_relative_change: "0.5"
      dimensions: [input_per_mtok, output_per_mtok, cache_read_per_mtok]
    evidence: *unreviewed_terms

  - id: deepseek-api-pricing
    provider: deepseek
    channel: deepseek-api
    catalog_channel: true
    url: https://api-docs.deepseek.com/quick_start/pricing
    parser: deepseek
    source_shape: token_table
    clarity: structured
    # The page lists peak and off-peak rates; the catalog stores the peak rate
    # with an off-peak rule, and the parser reads the peak rows.
    dimensions: [input_per_mtok, output_per_mtok, cache_read_per_mtok]
    # Not low-risk yet: the live page lists the models, but its peak rows no
    # longer parse. Promote once the parser and fingerprint are reviewed.
    fingerprint: null
    low_risk: {eligible: false, max_relative_change: null, dimensions: []}
    evidence: *unreviewed_terms

  - id: mistral-api-pricing
