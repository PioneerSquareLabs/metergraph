    clarity: option_dependent
    dimensions: [input_per_mtok, output_per_mtok, cache_read_per_mtok, batch_input_per_mtok, batch_output_per_mtok]
    fingerprint: null
    low_risk: {eligible: false, max_relative_change: null, dimensions: []}

  # One page prices both Bedrock channels: in-region on-demand rows and
  # geographic cross-region inference rows. Prices depend on the selected
  # region, provider tab and inference type.
  - id: aws-bedrock-pricing
    provider: aws
    channel: aws-bedrock
    catalog_channel: true
    url: https://aws.amazon.com/bedrock/pricing/
    parser: html-tables
    source_shape: token_option_dependent
    clarity: option_dependent
    dimensions: [input_per_mtok, output_per_mtok, cache_read_per_mtok, cache_write_5m_per_mtok, batch_input_per_mtok, batch_output_per_mtok]
    fingerprint: null
    low_risk: {eligible: false, max_relative_change: null, dimensions: []}

  - id: aws-bedrock-geo-pricing
